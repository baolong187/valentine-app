<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💕 Đi chơi với anh nhé?</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --pink-light: #fff0f3;
      --pink-mid: #ffd6e0;
      --pink-main: #ff6b9d;
      --pink-deep: #e91e8c;
      --red-heart: #e8445a;
      --text-dark: #c2185b;
      --cream: #fff5f7;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--pink-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Quicksand', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* ── Floating hearts background ── */
    .hearts-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .heart-float {
      position: absolute;
      font-size: clamp(10px, 2vw, 22px);
      animation: floatUp linear infinite;
      opacity: 0;
    }

    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.5; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* ── Top deco border ── */
    .top-deco {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 18px;
      color: var(--red-heart);
      opacity: 0.5;
      z-index: 1;
      user-select: none;
    }

    /* ── "love" deco bottom-right ── */
    .love-deco {
      position: fixed;
      bottom: 20px;
      right: 30px;
      font-family: 'Dancing Script', cursive;
      font-size: 60px;
      color: var(--red-heart);
      opacity: 0.35;
      z-index: 1;
      user-select: none;
      animation: pulse 2.5s ease-in-out infinite;
    }

    /* ── Scattered hearts deco ── */
    .scatter {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      font-size: clamp(14px, 2.5vw, 28px);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.15); }
    }

    /* ── Main card ── */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 107, 157, 0.25);
      border-radius: 32px;
      padding: 50px 60px 55px;
      overflow: hidden;
      text-align: center;
      max-width: 520px;
      width: 90vw;
      box-shadow:
        0 20px 60px rgba(233, 30, 140, 0.12),
        0 4px 20px rgba(255, 107, 157, 0.15),
        inset 0 1px 0 rgba(255,255,255,0.8);
      animation: cardIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: scale(0.8) translateY(30px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ── Dog image ── */
    .dog-wrap {
      width: 200px;
      height: 200px;
      margin: 0 auto 28px;
      border-radius: 20px;
      overflow: hidden;
      border: 4px solid var(--pink-mid);
      box-shadow: 0 8px 30px rgba(233, 30, 140, 0.2);
      position: relative;
      animation: wiggle 3s ease-in-out infinite;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-2deg); }
      50%       { transform: rotate(2deg); }
    }

    .dog-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .dog-label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.55));
      color: #fff;
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 2px;
      padding: 18px 8px 8px;
      text-align: left;
    }

    /* dog emoji fallback */
    .dog-emoji {
      font-size: 90px;
      line-height: 200px;
    }

    /* ── Heading ── */
    .heading {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(26px, 5vw, 38px);
      color: var(--text-dark);
      line-height: 1.3;
      margin-bottom: 36px;
      text-shadow: 0 2px 8px rgba(233, 30, 140, 0.15);
    }

    /* ── Buttons ── */
    .btn-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      position: relative;
      min-height: 130px;
    }

    .btn-yes {
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 18px;
      padding: 14px 36px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, var(--pink-main), var(--pink-deep));
      color: #fff;
      cursor: pointer;
      box-shadow:
        0 6px 25px rgba(233, 30, 140, 0.4),
        0 2px 8px rgba(255, 107, 157, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }

    .btn-yes::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent);
      border-radius: inherit;
    }

    .btn-yes:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow:
        0 12px 35px rgba(233, 30, 140, 0.5),
        0 4px 12px rgba(255, 107, 157, 0.4);
    }

    .btn-yes:active { transform: scale(0.97); }

    .btn-no {
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      font-size: 18px;
      padding: 14px 32px;
      border: 2px solid var(--pink-mid);
      border-radius: 50px;
      background: rgba(255,255,255,0.7);
      color: var(--pink-main);
      cursor: default;
      user-select: none;
      position: static;
      z-index: 100;
    }
    .btn-no.fleeing {
      position: absolute;
      transition: left 0.13s cubic-bezier(0.25,1.8,0.5,1), top 0.13s cubic-bezier(0.25,1.8,0.5,1);
    }

    /* ── Yes screen ── */
    .yes-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .yes-screen.show { display: flex; }

    .yes-emoji { font-size: 80px; animation: bounceIn 0.6s cubic-bezier(0.34,1.56,0.64,1); }

    .yes-text {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(28px, 5vw, 42px);
      color: var(--text-dark);
      line-height: 1.3;
    }

    .yes-sub {
      font-size: 16px;
      color: #e91e8c99;
      font-weight: 500;
    }

    @keyframes bounceIn {
      from { transform: scale(0); }
      to   { transform: scale(1); }
    }

    /* confetti burst */
    .confetti-piece {
      position: fixed;
      width: 10px; height: 10px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 999;
      animation: confettiFall 1.4s ease-in forwards;
    }

    @keyframes confettiFall {
      0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(80vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Top heart border -->
  <div class="top-deco" id="topDeco"></div>

  <!-- Floating hearts bg -->
  <div class="hearts-bg" id="heartsBg"></div>

  <!-- Scattered hearts -->
  <span class="scatter" style="top:20%;left:5%;color:#ff6bbd;animation-delay:0s">💕</span>
  <span class="scatter" style="top:60%;left:3%;color:#ff85c2;animation-delay:0.5s">💗</span>
  <span class="scatter" style="top:80%;left:8%;color:#ffb3d1;animation-delay:1s">💓</span>
  <span class="scatter" style="top:15%;right:6%;color:#e91e8c;animation-delay:0.3s">💖</span>
  <span class="scatter" style="top:50%;right:4%;color:#ff6b9d;animation-delay:0.8s">💝</span>
  <span class="scatter" style="top:75%;right:10%;color:#ff85c2;animation-delay:0.2s">💘</span>

  <!-- Love deco -->
  <div class="love-deco">love</div>

  <!-- Card -->
  <div class="card">

    <!-- Main content -->
    <div id="mainContent">
      <div class="dog-wrap">
        <img
          src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExc3d3aG81d3h0M3N1Z3RvYjVnbmdueXNhZng4Nzh6YmZudmRldHpncyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/LT3Jsj4B43t8EF4B0l/giphy.gif"
          alt="Puppy pleading eyes"
          style="width:100%;height:100%;object-fit:cover;display:block;"
        />

      </div>

      <h1 class="heading">Chaam ơiii đi chơi với anh nhé? 💕</h1>

      <div class="btn-group">
        <button class="btn-yes" onclick="sayYes()">Đồng ý ngay 💖</button>
        <button class="btn-no" id="btnNo">Không 🤔</button>
      </div>
    </div>

    <!-- Yes screen -->
    <div class="yes-screen" id="yesScreen">
      <div class="yes-emoji">🥰</div>
      <div class="yes-text">Tuyệt vời! 💗</div>
    </div>

  </div>

  <script>
    // ── Top border hearts ──
    const topDeco = document.getElementById('topDeco');
    const heartIcons = ['♡','♥','💕','💗'];
    for (let i = 0; i < 36; i++) {
      const s = document.createElement('span');
      s.textContent = heartIcons[i % heartIcons.length];
      topDeco.appendChild(s);
    }

    // ── Floating background hearts ──
    const bgEl = document.getElementById('heartsBg');
    const bgHearts = ['💕','💗','💓','💖','💝','💘','♡','🩷'];
    for (let i = 0; i < 22; i++) {
      const h = document.createElement('span');
      h.className = 'heart-float';
      h.textContent = bgHearts[Math.floor(Math.random() * bgHearts.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = (10 + Math.random() * 18) + 'px';
      const dur = 6 + Math.random() * 10;
      h.style.animationDuration = dur + 's';
      h.style.animationDelay = (-Math.random() * dur) + 's';
      bgEl.appendChild(h);
    }

    // ── Fleeing "No" button (stays inside the card) ──
    const btnNo = document.getElementById('btnNo');
    const btnGroup = btnNo.parentElement; // .btn-group
    let isFleeing = false;
    let btnX, btnY; // relative to btnGroup

    btnNo.addEventListener('mouseenter', () => {
      if (isFleeing) return;

      const btnRect   = btnNo.getBoundingClientRect();
      const groupRect = btnGroup.getBoundingClientRect();

      // Convert to position relative to btnGroup
      btnX = btnRect.left - groupRect.left;
      btnY = btnRect.top  - groupRect.top;

      // Lock size before switching to absolute
      btnNo.style.width  = btnRect.width  + 'px';
      btnNo.style.height = btnRect.height + 'px';

      isFleeing = true;
      btnNo.classList.add('fleeing');
      btnNo.style.left = btnX + 'px';
      btnNo.style.top  = btnY + 'px';

      // Keep group height stable
      btnGroup.style.minHeight = btnGroup.offsetHeight + 'px';
    });

    const FLEE_POWER = 55;

    document.addEventListener('mousemove', (e) => {
      if (!isFleeing) return;

      const groupRect = btnGroup.getBoundingClientRect();
      const bw = btnNo.offsetWidth;
      const bh = btnNo.offsetHeight;

      // Cursor relative to btnGroup
      const mouseX = e.clientX - groupRect.left;
      const mouseY = e.clientY - groupRect.top;

      // Button center relative to btnGroup
      const cx = btnX + bw / 2;
      const cy = btnY + bh / 2;

      const dx = mouseX - cx;
      const dy = mouseY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 70) {
        const angle = Math.atan2(dy, dx);
        const force = Math.max(0, (70 - dist) / 70);

        let newX = btnX - Math.cos(angle) * FLEE_POWER * force;
        let newY = btnY - Math.sin(angle) * FLEE_POWER * force;

        // Clamp inside card (btnGroup bounds)
        const pad = 6;
        const maxX = groupRect.width  - bw - pad;
        const maxY = groupRect.height - bh - pad;
        newX = Math.max(pad, Math.min(maxX, newX));
        newY = Math.max(-groupRect.height * 0.5, Math.min(maxY, newY));

        btnX = newX;
        btnY = newY;
        btnNo.style.left = btnX + 'px';
        btnNo.style.top  = btnY + 'px';
      }
    });

    // Touch support
    document.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      document.dispatchEvent(new MouseEvent('mousemove', { clientX: touch.clientX, clientY: touch.clientY }));
    }, { passive: true });

    // ── Yes handler ──
    function sayYes() {
      document.getElementById('mainContent').style.display = 'none';
      document.getElementById('yesScreen').classList.add('show');
      btnNo.style.display = 'none';
      launchConfetti();
    }

    function launchConfetti() {
      const colors = ['#ff6b9d','#e91e8c','#ffb3d1','#ff85c2','#ffd6e0','#c2185b'];
      for (let i = 0; i < 80; i++) {
        setTimeout(() => {
          const piece = document.createElement('div');
          piece.className = 'confetti-piece';
          piece.style.left = (20 + Math.random() * 60) + 'vw';
          piece.style.top = (10 + Math.random() * 30) + 'vh';
          piece.style.background = colors[Math.floor(Math.random() * colors.length)];
          piece.style.width = (6 + Math.random() * 10) + 'px';
          piece.style.height = piece.style.width;
          piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
          piece.style.animationDuration = (1 + Math.random() * 0.8) + 's';
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 2200);
        }, i * 18);
      }
    }
  </script>
</body>
</html>
